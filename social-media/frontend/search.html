<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search — SocialApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">Social<span>App</span></a>
      <div class="navbar-links">
        <span class="nav-username" id="navUsername"></span>
        <a href="index.html">Feed</a>
        <a href="profile.html">👤 Profile</a>
        <a href="#" id="logoutBtn"
          style="padding:7px 16px;border-radius:20px;color:#fff;background:#e94560">
          Logout
        </a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 style="margin-bottom:20px;color:#1a1a2e">🔍 Search Users</h2>

    <div class="search-bar">
      <input type="text" id="searchInput" class="search-input"
        placeholder="Search by name or username..." />
      <button onclick="searchUsers()" class="btn btn-primary">Search</button>
    </div>

    <div id="results"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
