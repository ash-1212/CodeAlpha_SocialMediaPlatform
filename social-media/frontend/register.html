<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — SocialApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-logo">Social<span>App</span></div>
      <div class="navbar-links">
        <a href="login.html">Login</a>
      </div>
    </div>
  </nav>

  <div class="form-box">
    <h2 class="form-title">Join SocialApp 🚀</h2>
    <p class="form-subtitle">Create your free account today</p>

    <div id="error" class="alert alert-error" style="display:none"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="yourhandle" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" required />
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
        Create Account
      </button>
    </form>

    <p class="form-footer">
      Already have an account? <a href="login.html">Login here</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>redirectIfLoggedIn()</script>
</body>
</html>
