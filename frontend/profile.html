<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile — SocialApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">Social<span>App</span></a>
      <div class="navbar-links">
        <span class="nav-username" id="navUsername"></span>
        <a href="index.html">Feed</a>
        <a href="search.html">🔍 Search</a>
        <a href="#" id="logoutBtn"
          style="padding:7px 16px;border-radius:20px;color:#fff;background:#e94560">
          Logout
        </a>
      </div>
    </div>
  </nav>

  <div class="container" id="profileContainer">

    <!-- Profile Header -->
    <div class="profile-header">
      <img id="profilePic" src="" class="avatar-lg"
        onerror="this.src='https://via.placeholder.com/90?text=U'" />
      <div class="profile-info">
        <div class="profile-name" id="profileName"></div>
        <div class="profile-username" id="profileUsername"></div>
        <div class="profile-bio" id="profileBio"></div>
        <div class="profile-stats">
          <div class="stat">
            <span class="stat-num" id="postsCount">0</span>
            <span class="stat-label">Posts</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="followersCount">0</span>
            <span class="stat-label">Followers</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="followingCount">0</span>
            <span class="stat-label">Following</span>
          </div>
        </div>
        <div id="profileAction"></div>
      </div>
    </div>

    <!-- Posts Grid -->
    <div class="card" style="padding:4px">
      <div class="posts-grid" id="postsGrid">
        <div class="loading">Loading posts...</div>
      </div>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
