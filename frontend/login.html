<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SocialApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-logo">Social<span>App</span></div>
      <div class="navbar-links">
        <a href="register.html">Create Account</a>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="form-box">
    <h2 class="form-title">Welcome Back 👋</h2>
    <p class="form-subtitle">Login to your account</p>

    <div id="error" class="alert alert-error" style="display:none"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
        Login
      </button>
    </form>

    <p class="form-footer">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>redirectIfLoggedIn()</script>
</body>
</html>
